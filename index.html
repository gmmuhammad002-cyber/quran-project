
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quran Project</title>
</head>

<body style="margin:0; min-height:100vh; font-family:Arial, sans-serif; background:linear-gradient(135deg,#071f19,#103b2e,#071f19); color:#f5f1e6; display:flex; justify-content:center; align-items:center; padding:24px; box-sizing:border-box;">

  <main style="width:100%; max-width:760px; text-align:center;">

    <div style="font-size:48px; color:#e3c477; margin-bottom:12px;">
      ☪
    </div>

    <p style="color:#e3c477; letter-spacing:4px; font-size:12px; font-weight:bold; margin:0 0 16px;">

    <h1 style="font-family:Georgia,serif; font-size:clamp(34px,7vw,54px); font-weight:normal; margin:0 0 16px; line-height:1.15;">

    <p style="font-size:16px; line-height:1.8; color:#c7d6ce; max-width:500px; margin:0 auto 32px;">
      Welcome to our Quran project. Explore Quran applications

    </p>

    <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:16px; margin-bottom:32px;">

      <a href="/iphone.html"
         style="text-decoration:none; background:#e3c477; color:#10291f; padding:16px 30px; border-radius:12px; font-size:16px; font-weight:bold; min-width:150px; box-sizing:border-box; box-shadow:0 6px 20px #00000030;">

      <a href="/android.html"
         style="text-decoration:none; background:transparent; color:#f5f1e6; padding:15px 30px; border:1px solid #e3c477; border-radius:12px; font-size:16px; font-weight:bold; min-width:150px; box-sizing:border-box;">
        Android &nbsp; ↗

    </div>

    <div style="background:#ffffff; padding:18px; border-radius:18px; display:inline-block; box-shadow:0 12px 35px #00000045; max-width:calc(100% - 36px); box-sizing:border-box;">

      <img
        src="./qr-code-image.png"
        alt="Quran project QR code"
        style="display:block; width:220px; max-width:100%; height:auto; object-fit:contain;"
      >

    </div>

    <p style="font-size:14px; color:#c7d6ce; margin:18px 0 0;">
      Scan the QR code to access the project
    </p>

    <div style="width:60px; height:2px; background:#e3c477; margin:30px auto 18px;"></div>

    <footer style="font-size:12px; color:#8fa99c; letter-spacing:1px;">
