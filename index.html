
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quran Project</title>
</head>

<body style="margin:0; min-height:100svh; box-sizing:border-box; font-family:Arial,sans-serif; background:linear-gradient(135deg,#071f19,#103b2e,#071f19); color:#f5f1e6; display:flex; justify-content:center; align-items:center; padding:12px;">

  <main style="width:100%; max-width:650px; text-align:center;">

    <div style="font-size:32px; color:#e3c477; margin-bottom:4px;">☪</div>

    <p style="color:#e3c477; letter-spacing:3px; font-size:10px; font-weight:bold; margin:0 0 8px;">
      LEARN · READ · DISCOVER
    </p>

    <h1 style="font-family:Georgia,serif; font-size:clamp(30px,5vw,42px); font-weight:normal; margin:0 0 8px;">
      The Holy Quran
    </h1>

    <p style="font-size:14px; line-height:1.5; color:#c7d6ce; max-width:430px; margin:0 auto 16px;">
      Explore Quran applications and discover useful resources for your device.
    </p>

    <h2 style="font-size:17px; font-weight:normal; margin:0 0 12px;">
      Choose Your Device
    </h2>

    <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-bottom:18px;">

      <a href="./iphone.html"
         style="text-decoration:none; background:#e3c477; color:#10291f; padding:12px 24px; border-radius:10px; font-size:15px; font-weight:bold; min-width:125px; box-sizing:border-box;">
        iPhone →
      </a>

      <a href="./android.html"
         style="text-decoration:none; background:transparent; color:#f5f1e6; padding:11px 24px; border:1px solid #e3c477; border-radius:10px; font-size:15px; font-weight:bold; min-width:125px; box-sizing:border-box;">
        Android →
      </a>

    </div>

    <h2 style="font-family:Georgia,serif; font-size:20px; font-weight:normal; margin:0 0 6px;">
      Scan to Explore
    </h2>

    <p style="font-size:12px; color:#c7d6ce; margin:0 auto 12px; line-height:1.4;">
      Scan this QR code with your phone camera.
    </p>

    <div style="display:inline-block; background:#ffffff; padding:12px; border-radius:14px; box-shadow:0 8px 24px #00000040; width:min(260px,65vw); box-sizing:border-box;">

      <img
        src="./qr-code-image.png"
        alt="Quran project QR code"
        style="display:block; width:100%; height:auto; object-fit:contain;"
      >

    </div>

    <footer style="font-size:10px; color:#8fa99c; letter-spacing:1px; margin-top:12px;">
      QURAN PROJECT · MADE FOR LEARNING
    </footer>

  </main>

</body>
</html>
